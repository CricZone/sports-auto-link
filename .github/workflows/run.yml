name: Sports Live Link Auto Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-sync]

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        run: python main.py
